<h1 class="top-2 text-center font-bold mb-4">
  Последние записи
  @if(postsCount() > 0) {
    ({{postsCount()}})
  }
</h1>
<div class="flex flex-col gap-4 px-4 mx-auto w-full max-w-full lg:max-w-3xl p-1">
    @for (post of posts(); track post.uuid) {
      <hlm-card class="w-full md:min-w-lg lg:min-w-3xl lg:max-w-3xl">
        <hlm-card-header class="flex flex-row justify-between items-center">
          <div>
            <h3 class="break-all" hlmCardTitle>{{post.title}}</h3>
            <p hlmCardDescription>{{post.datetime | date:'dd.MM.yyyy HH:mm' }}</p>
          </div>
          <button hlmBtn size="icon" variant="destructive" aria-label="Удалить запись"
                  (click)="postStorage.removePost(post.uuid)">
            <ng-icon name="remixCloseLine" />
          </button>
        </hlm-card-header>
        <div hlmCardContent class="markdown break-all">
          <div [innerHTML]="post.content | markdown"></div>
        </div>
        <hlm-card-footer>
          <p class="break-all">{{post.author}}</p>
        </hlm-card-footer>
      </hlm-card>
    } @empty {
      <hlm-empty>
        <hlm-empty-header>
          <p hlmEmptyTitle>Здесь пока нет записей</p>
        </hlm-empty-header>
        <hlm-empty-content>
          <a hlmBtn variant="outline" href="/create">Создать первую запись</a>
        </hlm-empty-content>
      </hlm-empty>
    }
  </div>
